{% extends "ecommerce/base.html" %}

{% block content %}
  <div class="container mt-4">
    <h1>{{ article.titre }}</h1>
    <p class="text-muted">
      Publié par <strong>{{ article.auteur.username }}</strong> le {{ article.date_publication }}
    </p>
    <hr>
    <div class="article-contenu">
      {{ article.contenu|linebreaks }}
    </div>
    <a href="{% url 'liste_articles' %}" class="btn btn-secondary mt-4">← Retour au blog</a>
  </div>
{% endblock %}
