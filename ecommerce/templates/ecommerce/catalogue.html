{% extends "ecommerce/base.html" %}
{% load static %}

{% block content %}
<style>
  .catalogue {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
  }
  
  .oeuvre-item {
    border: 1px solid #ccc;
    padding: 10px;
    width: 250px;
    text-align: center;
    border-radius: 8px;
  }
  
  .oeuvre-image {
    width: 100%;
    height: auto;
    border-radius: 4px;
  }
  </style>
  
  <h1>Catalogue des Œuvres d'Art</h1>
  <div class="catalogue">
    {% for oeuvre in oeuvres %}
      <div class="oeuvre-item">
        <h2>
          <a href="{% url 'detail_oeuvre' oeuvre.id %}">{{ oeuvre.titre }}</a>
        </h2>
        <img src="{% static 'img/' %}{{ oeuvre.image }}" alt="{{ oeuvre.titre }}" class="oeuvre-image">
        <p>Prix de location : {{ oeuvre.prix_location }} €</p>
      </div>
    {% empty %}
      <p>Aucune œuvre disponible pour le moment.</p>
    {% endfor %}
  </div>
{% endblock %}
