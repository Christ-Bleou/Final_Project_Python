{% extends "ecommerce/base.html" %}
{% block content %}
  <div class="confirm-suppression">
    <h2>Confirmer la suppression</h2>
    <p>Voulez-vous vraiment supprimer ce commentaire ?</p>

    <blockquote style="background:#f9f9f9; padding:10px; border-left: 3px solid #ccc;">
      <strong>{{ commentaire.auteur }} :</strong> {{ commentaire.contenu }}
      <br>
      <small>{{ commentaire.date_creation|date:"d/m/Y H:i" }}</small>
    </blockquote>

    <form method="post" style="margin-top:20px;">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Oui, supprimer</button>
      <a href="{% url 'detail_oeuvre' commentaire.oeuvre.id %}" class="btn btn-secondary">Annuler</a>
    </form>
  </div>
{% endblock %}
